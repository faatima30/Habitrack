<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo">HabitTrack</div>
        <ul class="menu">
          <li class="active"><a href="#">Dashboard</a></li>
          <li><a href="manageHabits.html">Manage Habits</a></li>
        </ul>
      </aside>
      <main class="main-content">
        <div class="topbar">
          <button class="toggle-btn">🌙</button>
        </div>
        <div class="content">
          <h1>Dashboard</h1>
          <div class="stats">
            <div class="card">
              <h3>Total Habits</h3>
              <span id="totalHabits">0</span>
            </div>
            <div class="card">
              <h3>Completed Habits</h3>
              <span id="completedHabits">0</span>
            </div>
            <div class="card">
              <h3>Completed Today</h3>
              <span id="completedToday">0</span>
            </div>
            <div class="card">
              <h3>Today's Motivation</h3>
              <p id="motivationText">Loading...</p>
            </div>
          </div>
          <!-- LATEST HABITS  -->
          <h1>Latest Habits</h2>
          <div class="habits-grid" id="latestHabits"></div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
